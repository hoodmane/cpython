# Any data that can vary between Python versions is to be kept in this file.
# This allows for blanket copying of the Emscripten build code between supported
# Python versions.
emscripten-version = "6.0.10"
node-version = "24"
test-args = [
    "-m", "test",
    "-v",
    "-uall",
    "--rerun",
    "--single-process",
    "-W",
]
pythoninfo-args = [
    "-m", "test.pythoninfo",
]

[dependencies.libffi]
url = "https://github.com/libffi/libffi/releases/download/v{version}/libffi-{version}.tar.gz"
version = "3.4.6"
shasum = "b0dea9df23c863a7a50e825440f3ebffabd65df1497108e5d437747843895a4e"

[dependencies.mpdec]
url = "https://www.bytereef.org/software/mpdecimal/releases/mpdecimal-{version}.tar.gz"
version = "4.0.1"
shasum = "96d33abb4bb0070c7be0fed4246cd38416188325f820468214471938545b1ac8"


[dependencies.hiwire]
url = "https://github.com/pyodide/hiwire/archive/refs/tags/{version}.tar.gz"
version = "1.0.1"
shasum = "b03fbd2ba0e22f85e6f36babc0bdb3d7d5fde9a60bb9589f4d103389781c4493"
